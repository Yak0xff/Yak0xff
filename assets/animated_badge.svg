<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400" role="img" aria-label="animated badge">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0%" stop-color="#FF7A00"/>
      <stop offset="100%" stop-color="#FFC78A"/>
    </linearGradient>
    <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="20" fill="#071029" />

  <!-- pulsating halo -->
  <circle cx="100" cy="80" r="34" fill="url(#g1)" opacity="0.18">
    <animate attributeName="r" values="34;44;34" dur="3.5s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.18;0.06;0.18" dur="3.5s" repeatCount="indefinite" />
  </circle>

  <!-- main badge circle -->
  <circle cx="100" cy="80" r="28" fill="#FF7A00" filter="url(#f1)" />

  <!-- rotating chevrons -->
  <g transform="translate(100,80)" fill="#071029" opacity="0.98">
    <g id="chev">
      <polygon points="0,-20 14,0 0,6 -14,0" />
    </g>
    <use href="#chev" transform="rotate(60)" />
    <use href="#chev" transform="rotate(120)" />
    <use href="#chev" transform="rotate(180)" />
    <use href="#chev" transform="rotate(240)" />
    <use href="#chev" transform="rotate(300)" />
    <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite" />
  </g>

  <!-- small center icon -->
  <g transform="translate(100,80)" fill="#071029">
    <rect x="-8" y="-8" width="16" height="16" rx="3" />
    <rect x="-4" y="-12" width="8" height="4" rx="1" fill="#fff" opacity="0.06" />
  </g>

  <!-- label -->
  <text x="100" y="150" font-family="Segoe UI, Roboto, Arial" font-size="12" fill="#FFC78A" text-anchor="middle">Yak0xff</text>
</svg>
